# The MAINNET deployment: same code as wrangler.toml, its own name, secrets and KV namespace.
#   npx wrangler deploy --config wrangler.mainnet.toml
#   npx wrangler secret put <NAME> --config wrangler.mainnet.toml
name = "draftgem-mainnet"
main = "src/index.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]

[vars]
NETWORK = "mainnet"
# Players may create their own tournaments (within the mainnet fee limits). "off" switches it off again.
PLAYER_TOURNAMENTS = "on"
TREASURY_WALLET = "BAZrwd5FoT9s3S3MMpm8ZqCe3E5uXkHv5srS9Ybik8oL"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "CACHE"
id = "071ad929bf01448381304dfa82066d79"
