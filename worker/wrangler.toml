name = "pumpfantasy-cron"
main = "src/index.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]

# Cadence kept ≤ ROUND_DURATION_SECONDS (src/index.ts) so a tournament is
# always somewhere in its Live phase — see tournamentPhase.ts's math on the
# mobile side for why cadence > round length leaves Live empty part of the
# time.
[triggers]
crons = ["* * * * *"]

# Holds the last good cross-chain market caps for wrapped coins (see
# src/bridgedAssets.ts) — CoinGecko rate-limits Workers' shared egress IP and
# the Cache API doesn't persist on workers.dev, so this is the cache.
[[kv_namespaces]]
binding = "CACHE"
id = "1cd9f6bb2a714eb9b1684ce929cab7e2"
